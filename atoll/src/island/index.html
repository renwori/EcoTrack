<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob: file:; media-src * data: blob: file:; connect-src *;">
  <title>Atoll</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="island" class="collapsed" data-tab="home">
    <canvas id="wave"></canvas>

    <!-- Свёрнутый вид: «капсула» -->
    <div id="pill">
      <img id="pillCover" class="pill-cover" alt="">
      <span id="pillWeather" class="pill-weather"></span>
      <span id="pillTime" class="pill-time">--:--</span>
      <span id="pillTimer" class="pill-timer"></span>
      <span id="pillBars" class="pill-bars"><i></i><i></i><i></i><i></i></span>
    </div>

    <!-- Всплывающее событие: таймер, напоминание, новый трек -->
    <div id="alert">
      <div class="alert-icon" id="alertIcon"></div>
      <div class="alert-text">
        <div class="alert-title" id="alertTitle"></div>
        <div class="alert-sub" id="alertSub"></div>
      </div>
      <div class="alert-actions" id="alertActions"></div>
    </div>

    <!-- Развёрнутая панель -->
    <div id="panel">
      <nav id="tabs">
        <button data-tab="home" title="Главная"><svg><use href="#i-home"/></svg><span>Главная</span></button>
        <button data-tab="music" title="Музыка"><svg><use href="#i-music"/></svg><span>Музыка</span></button>
        <button data-tab="weather" title="Погода"><svg><use href="#i-cloud"/></svg><span>Погода</span></button>
        <button data-tab="notes" title="Заметки"><svg><use href="#i-note"/></svg><span>Заметки</span></button>
        <button data-tab="timer" title="Таймер"><svg><use href="#i-timer"/></svg><span>Таймер</span></button>
        <div class="spacer"></div>
        <button id="pinBtn" class="icon-only" title="Закрепить открытым"><svg><use href="#i-pin"/></svg></button>
        <button data-tab="settings" class="icon-only" title="Настройки"><svg><use href="#i-gear"/></svg></button>
      </nav>

      <!-- Главная -->
      <section class="page" data-page="home">
        <div class="home-grid">
          <div class="card np" id="homeNp"></div>
          <div class="home-side">
            <div class="card mini-weather" id="homeWeather"></div>
            <div class="card mini-timer" id="homeTimer"></div>
            <div class="card mini-note" id="homeNote"></div>
          </div>
        </div>
      </section>

      <!-- Музыка -->
      <section class="page" data-page="music">
        <div class="seg" id="musicSeg">
          <button data-src="yandex">Яндекс Музыка</button>
          <button data-src="radio">Радио</button>
          <button data-src="local">Мои файлы</button>
        </div>
        <div class="music-body">
          <div class="music-pane" data-pane="yandex" id="paneYandex"></div>
          <div class="music-pane" data-pane="radio">
            <div class="search-row">
              <input id="radioSearch" type="search" placeholder="Найти станцию: Европа Плюс, lofi, джаз…">
            </div>
            <div class="chips" id="radioChips"></div>
            <div class="list" id="radioList"></div>
          </div>
          <div class="music-pane" data-pane="local">
            <div class="search-row">
              <button class="btn" id="pickFolder"><svg><use href="#i-folder"/></svg>Выбрать папку</button>
              <input id="localSearch" type="search" placeholder="Поиск по трекам">
              <button class="icon-btn" id="shuffleBtn" title="Перемешать"><svg><use href="#i-shuffle"/></svg></button>
              <button class="icon-btn" id="repeatBtn" title="Повтор"><svg><use href="#i-repeat"/></svg></button>
            </div>
            <div class="folder-name" id="folderName"></div>
            <div class="list" id="localList"></div>
          </div>
        </div>
      </section>

      <!-- Погода -->
      <section class="page" data-page="weather">
        <div id="weatherPage" class="weather-page"></div>
      </section>

      <!-- Заметки -->
      <section class="page" data-page="notes">
        <div class="notes">
          <div class="notes-side">
            <div class="seg small" id="notesSeg">
              <button data-mode="notes">Заметки</button>
              <button data-mode="tasks">Задачи</button>
            </div>
            <div class="list notes-list" id="notesList"></div>
            <button class="btn ghost" id="addNote">+ Новая</button>
          </div>
          <div class="notes-main" id="notesMain"></div>
        </div>
      </section>

      <!-- Таймер и напоминания -->
      <section class="page" data-page="timer">
        <div class="timer-page">
          <div class="timer-left">
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" class="ring-bg"/>
                <circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/>
              </svg>
              <div class="ring-time" id="ringTime">5:00</div>
            </div>
            <div class="timer-controls">
              <button class="btn accent" id="timerStart">Старт</button>
              <button class="btn ghost" id="timerReset">Сброс</button>
            </div>
            <div class="chips" id="timerPresets"></div>
            <div class="custom-row">
              <input id="timerCustom" type="number" min="1" max="600" placeholder="мин">
              <button class="btn ghost" id="timerCustomSet">Своё время</button>
            </div>
          </div>
          <div class="timer-right">
            <div class="h3">Напоминания</div>
            <div class="rem-form">
              <input id="remText" type="text" placeholder="Что напомнить?">
              <input id="remTime" type="time">
              <button class="btn accent" id="remAdd">+</button>
            </div>
            <div class="hint">Можно и так: «через 20 минут позвонить маме»</div>
            <div class="list" id="remList"></div>
          </div>
        </div>
      </section>

      <!-- Настройки -->
      <section class="page" data-page="settings">
        <div class="settings" id="settingsPage"></div>
      </section>
    </div>
  </div>

  <audio id="player" preload="none"></audio>

  <!-- Иконки -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z M14 3v5h5 M8 12h8 M8 16h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2 M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2" fill="currentColor"/><rect x="14" y="4" width="4.5" height="16" rx="1.2" fill="currentColor"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5.5v13a1 1 0 0 0 1.6.8l8.4-6.5a1 1 0 0 0 0-1.6L6.6 4.7A1 1 0 0 0 5 5.5z" fill="currentColor"/><rect x="16.5" y="5" width="2.5" height="14" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path d="M5 5.5v13a1 1 0 0 0 1.6.8l8.4-6.5a1 1 0 0 0 0-1.6L6.6 4.7A1 1 0 0 0 5 5.5z" fill="currentColor"/><rect x="16.5" y="5" width="2.5" height="14" rx="1" fill="currentColor"/></g></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.2 8.2 3.1 4.5 6.6 4.5c2 0 3.4 1.1 4.4 2.5 1-1.4 2.4-2.5 4.4-2.5 3.5 0 5.4 3.7 3.8 6.9C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="currentColor"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5 M4 20 21 3 M21 16v5h-5 M15 15l6 6 M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4 M3 11V9a4 4 0 0 1 4-4h14 M7 23l-4-4 4-4 M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6 M20 4l-9 9 M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-radio" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 8l10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="15.5" cy="14" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 12h4M6 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <script src="weather.js"></script>
  <script src="app.js"></script>
</body>
</html>
