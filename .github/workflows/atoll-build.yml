name: Atoll — сборка для Windows

on:
  push:
    paths:
      - 'atoll/**'
      - '.github/workflows/atoll-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atoll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: atoll/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка кода
        run: npm run check

      - name: Сборка установщика и портативной версии
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Загрузка готовых файлов
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-Windows
          path: |
            atoll/dist/*.exe
          if-no-files-found: error
          retention-days: 30
