<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d2e">
<title>ЭкоТрек</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5ef;--card:#fff;--text:#10241a;--muted:#5f7468;--pri:#12a150;--pri-ink:#fff;--pri2:#dcf3e4;--lime:#c8f169;--deep:#0b3d2e;--line:#dbe8df;--err:#c0392b;--r:22px;--sh:0 1px 2px rgba(11,61,46,.06),0 8px 24px -12px rgba(11,61,46,.18);--ease:cubic-bezier(.2,.8,.2,1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1511;--card:#13221b;--text:#e8f3ec;--muted:#8da598;--pri:#3ecf7b;--pri-ink:#07281a;--pri2:#1b382a;--line:#223a2d;--err:#ff7b6b;--sh:0 8px 24px -12px rgba(0,0,0,.6)}}
:root[data-theme=dark]{--bg:#0a1511;--card:#13221b;--text:#e8f3ec;--muted:#8da598;--pri:#3ecf7b;--pri-ink:#07281a;--pri2:#1b382a;--line:#223a2d;--err:#ff7b6b;--sh:0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:600 16px/1.45 Nunito,system-ui,sans-serif;overflow-wrap:anywhere;transition:background .3s}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 110px}
h1,h2{font-family:Unbounded,Nunito,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(22px,6vw,28px);margin:.5em 0 .6em}h2{font-size:clamp(17px,4.6vw,20px);margin:.2em 0}
.muted{color:var(--muted);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--sh)}
input,textarea,select{width:100%;max-width:100%;padding:14px 16px;margin:6px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri2)}
button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:13px 20px;min-height:46px;background:var(--pri);color:var(--pri-ink);cursor:pointer;max-width:100%;transition:transform .15s var(--ease),filter .2s,box-shadow .2s;box-shadow:0 4px 0 rgba(0,0,0,.14)}
button:hover{filter:brightness(1.06)}button:active{transform:translateY(3px) scale(.98);box-shadow:0 1px 0 rgba(0,0,0,.14)}
button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button.ghost{background:var(--pri2);color:var(--pri);box-shadow:none}button:disabled{opacity:.5;pointer-events:none}
.err{color:var(--err);min-height:1.4em;font-weight:700}.row{display:flex;gap:12px;align-items:center}.grow{flex:1;min-width:0}
.ava{flex:none;width:64px;height:64px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font:700 22px Unbounded,sans-serif;color:var(--deep)}
.bar{height:14px;border-radius:9px;background:var(--pri2);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--lime));transition:width 1.1s var(--ease)}
.hero{background:linear-gradient(135deg,var(--deep),#12775a);color:#fff;border:0;position:relative;overflow:hidden}
.hero .muted{color:#b9dccb}.hero .ava{width:72px;height:72px}
.hero::after{content:"🌿";position:absolute;right:-8px;top:-14px;font-size:96px;opacity:.14;transform:rotate(18deg);animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2deg) translateY(6px)}}
.lvl{font:700 34px Unbounded,sans-serif;line-height:1}
.view{animation:in .35s var(--ease)}@keyframes in{from{opacity:0;transform:translateY(8px)}}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:496px;margin:0 auto;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh);padding:6px}
nav div{display:flex;gap:2px}
nav button{flex:1;min-width:0;background:none;color:var(--muted);border-radius:20px;font-size:11px;font-weight:700;padding:7px 0;min-height:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:none}
nav button b{display:block;font-size:21px;transition:transform .3s var(--ease)}
nav button.on{background:var(--pri2);color:var(--pri)}nav button.on b{transform:translateY(-2px) scale(1.15)}
.task{display:flex;gap:12px;align-items:center;transition:opacity .3s,transform .3s}.task .ic{font-size:30px;flex:none;width:52px;height:52px;border-radius:16px;background:var(--pri2);display:grid;place-items:center}
.done{opacity:.55}.done .ck{animation:pop .5s var(--ease)}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}}
.tabs{display:flex;gap:8px;margin-bottom:10px;background:var(--bg);padding:5px;border-radius:18px}.tabs button{flex:1;padding:11px 6px;box-shadow:none}
.opt{width:100%;margin:6px 0;text-align:left;background:var(--bg);color:var(--text);border:2px solid var(--line);box-shadow:none}
.opt:hover{border-color:var(--pri)}.opt.pick{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.q{animation:slide .35s var(--ease)}@keyframes slide{from{opacity:0;transform:translateX(24px)}}
.gico{font-size:34px;display:inline-block;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px) rotate(-6deg)}}
.logo{font-size:64px;display:inline-block;animation:bob 3.2s ease-in-out infinite}
.spin{width:28px;height:28px;border-radius:50%;border:4px solid var(--pri2);border-top-color:var(--pri);animation:rot .8s linear infinite;margin:24px auto}@keyframes rot{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:30px;box-shadow:var(--sh);z-index:9;transition:transform .45s var(--ease);max-width:90vw;font-weight:800}
#toast.on{transform:translate(-50%,0)}
.news{display:block;transition:transform .2s var(--ease)}.news:hover{transform:translateY(-2px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div><div id="toast" role="status"></div>
<script type="module">
import {API_URL,BRAND} from "./config.js?v=6";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=localStorage.getItem("tk"), me=null, tab="profile", mode="login", tt;
const spin=`<div class="spin"></div>`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2600)}
async function api(action,d={}){
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token,...d})});return await r.json()}
  catch{return{ok:false,error:"Нет соединения с сервером. Проверьте интернет."}}
}
const level=xp=>({lv:Math.floor(xp/100)+1,pct:xp%100});
function theme(t){const r=document.documentElement;t==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",t);localStorage.setItem("theme",t)}
theme(localStorage.getItem("theme")||"auto");
const setSession=r=>{token=r.token;me=r.user;localStorage.setItem("tk",token);theme(me.theme)};
const grow=(sel,pct)=>requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$(sel);if(b)b.style.width=pct+"%"}));

function authView(msg=""){
  const reg=mode==="register";
  app.innerHTML=`<div class="view"><div style="text-align:center;margin-top:28px"><div class="logo">${BRAND.emoji}</div><h1>${BRAND.name}</h1>
  <p class="muted">Заботиться о планете — просто и интересно</p></div>
  <div class="card"><div class="tabs"><button class="${reg?"ghost":""}" id="m1">Вход</button><button class="${reg?"":"ghost"}" id="m2">Регистрация</button></div>
  ${reg?`<input id="fn" placeholder="Имя" maxlength=40 autocomplete="given-name"><input id="ln" placeholder="Фамилия" maxlength=40 autocomplete="family-name">`:""}
  <input id="un" placeholder="Юзернейм (a-z, 0-9, _)" maxlength=20 autocomplete="username" autocapitalize="none">
  <input id="pw" type="password" placeholder="Пароль (от 8 символов)" autocomplete="${reg?"new-password":"current-password"}">
  ${reg?`<input id="pw2" type="password" placeholder="Повторите пароль" autocomplete="new-password">`:""}
  <div class="err" id="er">${esc(msg)}</div><button id="go" style="width:100%">${reg?"Зарегистрироваться":"Войти"}</button></div></div>`;
  $("#m1").onclick=()=>{mode="login";authView()};$("#m2").onclick=()=>{mode="register";authView()};
  $("#go").onclick=async()=>{
    const er=$("#er"),b=$("#go"),username=$("#un").value.trim().toLowerCase().replace(/^@/,""),password=$("#pw").value;
    er.textContent="";
    if(!/^[a-z0-9_]{3,20}$/.test(username))return er.textContent="Юзернейм: 3–20 символов, a-z, 0-9 и _";
    let body={username,password};
    if(reg){
      if(!$("#fn").value.trim()||!$("#ln").value.trim())return er.textContent="Укажите имя и фамилию";
      if(password.length<8)return er.textContent="Пароль должен быть не короче 8 символов";
      if(password!==$("#pw2").value)return er.textContent="Пароли не совпадают";
      body={...body,firstName:$("#fn").value.trim(),lastName:$("#ln").value.trim()};
    }
    b.disabled=true;b.textContent="Подождите…";
    const r=await api(reg?"register":"login",body);
    if(!r.ok){b.disabled=false;b.textContent=reg?"Зарегистрироваться":"Войти";return er.textContent=r.error}
    setSession(r);shell();
  };
}

function shell(){
  const T=[["feed","📰","Лента"],["friends","👥","Друзья"],["games","🎮","Игры"],["settings","⚙️","Настройки"],["profile","👤","Профиль"]];
  app.innerHTML=`<div id="view" class="view"></div><nav><div>${T.map(([k,i,n])=>`<button data-t="${k}" class="${k===tab?"on":""}"><b>${i}</b>${n}</button>`).join("")}</div></nav>`;
  app.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
  ({feed:feedV,friends:friendsV,games:gamesV,settings:settingsV,profile:profileV})[tab]();
}
const logout=async()=>{await api("logout");localStorage.removeItem("tk");token=me=null;tab="profile";authView()};
const dead=r=>{if(r.error&&r.error.includes("Сессия")){localStorage.removeItem("tk");token=me=null;authView(r.error);return true}};

async function feedV(){
  $("#view").innerHTML=`<h1>Лента</h1><div id="nw">${spin}</div>`;
  const r=await api("news");if(dead(r)||!$("#nw"))return;if(!r.ok)return $("#nw").innerHTML=`<div class="err">${esc(r.error)}</div>`;
  $("#nw").innerHTML=r.news.length?r.news.map(n=>`<a class="card news" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none"><b>${esc(n.title)}</b><div class="muted" style="font-size:13px;margin-top:6px">${esc(n.source)} · ${new Date(n.published).toLocaleDateString("ru-RU")}</div><div style="color:var(--pri);margin-top:6px">Читать оригинал</div></a>`).join(""):`<div class="card" style="text-align:center"><div class="gico">📭</div><h2>Пока пусто</h2><p class="muted">Новости подтягиваются из источников, которые добавляет администратор.</p></div>`;
}
const ppl=(u,btns)=>`<div class="row" style="margin:10px 0"><div class="ava" style="width:46px;height:46px;font-size:15px">${esc(u.firstName[0]+u.lastName[0])}</div><div class="grow"><b>${esc(u.firstName)} ${esc(u.lastName)}</b><div class="muted">@${esc(u.username)} · ур. ${level(u.xp).lv}</div></div>${btns}</div>`;
const fb=(a,u,t,g)=>`<button class="${g?"ghost":""}" data-a="${a}" data-u="${esc(u.username)}">${t}</button>`;
async function friendsV(){
  $("#view").innerHTML=`<h1>Друзья</h1><div class="card"><b>Найти по юзернейму</b><input id="q" placeholder="@username (от 3 символов)" autocapitalize="none"><button id="sq" style="width:100%">Найти</button><div id="sr"></div></div><div id="fl">${spin}</div>`;
  $("#view").onclick=async e=>{const b=e.target.closest("button[data-a]");if(!b)return;b.disabled=true;
    const m={add:["friendAdd",{},"Запрос отправлен"],ok:["friendRespond",{accept:true},"Теперь вы друзья 🎉"],no:["friendRespond",{accept:false},"Запрос отклонён"],rm:["friendRemove",{},"Готово"]}[b.dataset.a];
    const r=await api(m[0],{username:b.dataset.u,...m[1]});if(dead(r))return;toast(r.ok?m[2]:r.error);friendsV()};
  const search=async()=>{const b=$("#sq");b.disabled=true;b.textContent="Ищем…";const r=await api("search",{q:$("#q").value});if(!$("#sr"))return;b.disabled=false;b.textContent="Найти";if(dead(r))return;
    $("#sr").innerHTML=!r.ok?`<div class="err">${esc(r.error)}</div>`:r.users.length?r.users.map(u=>ppl(u,{none:fb("add",u,"Добавить"),sent:"<span class=muted>Отправлено</span>",received:fb("ok",u,"Принять"),friend:"<span class=muted>Друг ✓</span>"}[u.rel])).join(""):`<div class="muted" style="margin-top:8px">Никого не найдено</div>`};
  $("#sq").onclick=search;$("#q").onkeydown=e=>{if(e.key==="Enter")search()};
  const r=await api("friends");if(dead(r)||!$("#fl"))return;if(!r.ok)return $("#fl").innerHTML=`<div class="err">${esc(r.error)}</div>`;
  const sec=(t,a,f)=>a.length?`<div class="card"><b>${t}</b>${a.map(f).join("")}</div>`:"";
  $("#fl").innerHTML=sec("Запросы в друзья",r.incoming,u=>ppl(u,fb("ok",u,"Принять")+fb("no",u,"✕",1)))+sec("Мои друзья ("+r.friends.length+")",r.friends,u=>ppl(u,fb("rm",u,"Удалить",1)))+sec("Отправленные запросы",r.outgoing,u=>ppl(u,fb("rm",u,"Отменить",1)))||`<div class="card muted" style="text-align:center"><div class="gico">🤝</div><p>Пока нет друзей. Найдите кого-нибудь по юзернейму.</p></div>`;
}
async function play(g){
  const v=$("#view");v.innerHTML=spin;
  const r=await api("gameStart",{game:g});if(dead(r))return;if(!r.ok){v.innerHTML=`<div class="card err">${esc(r.error)}</div>`;return}
  const items=r.items,ans=[];let i=0;
  const step=()=>{if(i>=items.length)return finish();const it=items[i];
    v.innerHTML=`<h1>${g==="sort"?"♻️ Сортировка":"❓ Викторина"}</h1><div class="bar"><i id="pg"></i></div><p class="muted">Вопрос ${i+1} из ${items.length}</p><div class="card q"><h2>${esc(it.q)}</h2><div style="margin-top:8px">${it.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div></div>${r.played?`<p class="muted">Награда за эту игру сегодня уже получена, играйте для тренировки.</p>`:""}`;
    grow("#pg",i/items.length*100);
    v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{b.classList.add("pick");v.querySelectorAll("[data-k]").forEach(x=>x.disabled=true);setTimeout(()=>{ans.push({id:it.id,a:+b.dataset.k});i++;step()},280)})};
  const finish=async()=>{v.innerHTML=spin;const s=await api("gameSubmit",{game:g,answers:ans});if(dead(s))return;
    if(!s.ok){v.innerHTML=`<div class="card err">${esc(s.error)}</div><button id="bk">Назад</button>`;$("#bk").onclick=gamesV;return}
    const m=await api("me");if(m.ok)me=m.user;
    const emo=s.score===s.total?"🏆":s.score>=s.total/2?"🌱":"💪";
    v.innerHTML=`<div class="card hero" style="text-align:center"><div class="gico" style="font-size:56px">${emo}</div><h1 style="margin:.2em 0">${s.score} из ${s.total}</h1><b>${s.xp?`+${s.xp} XP`:"XP за эту игру сегодня уже получены"}</b></div>`+s.results.filter(x=>!x.ok).map(x=>{const it=items.find(t=>t.id===x.id);return`<div class="card"><b>${esc(it.q)}</b><div style="color:var(--pri)">Правильно: ${esc(it.o[x.right])}</div><div class="muted">${esc(x.e)}</div></div>`}).join("")+`<button id="bk" style="width:100%">К играм</button>`;$("#bk").onclick=gamesV;if(s.xp)toast("+"+s.xp+" XP 🎉")};
  step();
}

function profileV(){
  const {lv,pct}=level(me.xp);
  $("#view").innerHTML=`<div class="card hero"><div class="row"><div class="ava">${esc((me.firstName[0]||"")+(me.lastName[0]||""))}</div><div class="grow"><h2>${esc(me.firstName)} ${esc(me.lastName)}</h2>
  <div class="muted">@${esc(me.username)}${me.role!=="student"?" · "+(me.role==="teacher"?"Учитель":"Администратор"):""}</div></div></div>
  <div class="row" style="margin-top:18px"><div class="lvl">${lv}</div><div class="grow"><div class="muted">уровень · ${me.xp} XP</div><div class="bar" style="margin-top:6px;background:rgba(255,255,255,.18)"><i id="xb"></i></div></div></div>
  <div class="muted" style="margin-top:8px">До следующего уровня: ${100-pct} XP</div></div>
  <div class="card"><b>Редактировать профиль</b><input id="fn" value="${esc(me.firstName)}" maxlength=40 placeholder="Имя"><input id="ln" value="${esc(me.lastName)}" maxlength=40 placeholder="Фамилия">
  <textarea id="bio" rows=3 maxlength=200 placeholder="О себе">${esc(me.bio)}</textarea><div class="err" id="er"></div><button id="sv" style="width:100%">Сохранить</button></div>`;
  grow("#xb",pct);
  $("#sv").onclick=async()=>{
    const r=await api("update",{firstName:$("#fn").value,lastName:$("#ln").value,bio:$("#bio").value});
    if(dead(r))return;if(r.ok){me=r.user;profileV();toast("Сохранено ✓")}else $("#er").textContent=r.error;
  };
}

async function gamesV(){
  $("#view").innerHTML=`<h1>Игры и задания</h1><h2>Задания на сегодня</h2><div id="tk">${spin}</div>
  <h2 style="margin-top:20px">Мини-игры</h2>
  <div class="card row"><div class="gico">♻️</div><div class="grow"><b>Сортировка мусора</b><p class="muted" style="margin:2px 0 10px">Куда выбросить? 5 предметов. Правила приёма могут отличаться в вашем городе.</p><button data-g="sort">Играть</button></div></div>
  <div class="card row"><div class="gico">❓</div><div class="grow"><b>Эко-викторина</b><p class="muted" style="margin:2px 0 10px">5 вопросов об экологии.</p><button data-g="quiz">Играть</button></div></div>
  <p class="muted" style="font-size:13px">XP даётся за первое прохождение каждой игры в день.</p>`;
  $("#view").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>play(b.dataset.g));
  const r=await api("tasks");if(dead(r)||!$("#tk"))return;
  if(!r.ok)return $("#tk").innerHTML=`<div class="err">${esc(r.error)}</div>`;
  $("#tk").innerHTML=r.tasks.map(t=>`<div class="card task ${t.done?"done":""}"><div class="ic">${t.icon}</div><div class="grow"><b>${esc(t.title)}</b>
  <div class="muted">${esc(t.description)}</div><div style="color:var(--pri)">+${t.xp} XP</div></div>${t.done?`<span class="ck" style="font-size:26px">✅</span>`:`<button data-s="${t.slot}" data-x="${t.xp}">Готово</button>`}</div>`).join("")+
  `<p class="muted" style="font-size:13px">Это самоотчёт. Новые задания — каждый день.</p>`;
  $("#tk").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    b.disabled=true;const c=await api("complete",{slot:+b.dataset.s});if(c.gained)toast("+"+c.gained+" XP 🌿");const m=await api("me");if(m.ok)me=m.user;gamesV();
  });
}

function settingsV(){
  $("#view").innerHTML=`<h1>Настройки</h1>
  <div class="card"><b>Тема</b><select id="th"><option value="auto">Как в системе</option><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div>
  <div class="card"><b>Сменить юзернейм</b><input id="nu" placeholder="Новый юзернейм" maxlength=20 autocapitalize="none"><input id="up" type="password" placeholder="Текущий пароль">
  <div class="err" id="e1"></div><button id="b1" style="width:100%">Сменить юзернейм</button></div>
  <div class="card"><b>Сменить пароль</b><input id="op" type="password" placeholder="Текущий пароль"><input id="np" type="password" placeholder="Новый пароль (от 8 символов)"><input id="np2" type="password" placeholder="Повторите новый пароль">
  <div class="err" id="e2"></div><button id="b2" style="width:100%">Сменить пароль</button></div>
  <div class="card"><button class="ghost" id="out" style="width:100%">Выйти из аккаунта</button></div>`;
  $("#th").value=me.theme;
  $("#th").onchange=async e=>{theme(e.target.value);const r=await api("update",{theme:e.target.value});if(r.ok)me=r.user};
  $("#b1").onclick=async()=>{const r=await api("changeUsername",{username:$("#nu").value.trim().toLowerCase().replace(/^@/,""),password:$("#up").value});
    if(dead(r))return;if(r.ok){me=r.user;$("#e1").textContent="";toast("Юзернейм изменён ✓");$("#nu").value=$("#up").value=""}else $("#e1").textContent=r.error};
  $("#b2").onclick=async()=>{if($("#np").value!==$("#np2").value)return $("#e2").textContent="Пароли не совпадают";
    const r=await api("changePassword",{oldPassword:$("#op").value,newPassword:$("#np").value});
    if(dead(r))return;$("#e2").textContent=r.ok?"":r.error;if(r.ok){toast("Пароль изменён ✓");$("#op").value=$("#np").value=$("#np2").value=""}};
  $("#out").onclick=logout;
  for(const id of ["b1","b2"]){const b=$("#"+id),f=b.onclick;b.onclick=async()=>{const t=b.textContent;b.disabled=true;b.textContent="Подождите…";try{await f()}finally{b.disabled=false;b.textContent=t}}}
}

(async()=>{
  if(!API_URL){app.innerHTML=`<div class="card"><h2>Сервер не подключён</h2><p class="muted">Вставьте адрес веб-приложения Apps Script в файл config.js.</p></div>`;return}
  if(token){const r=await api("me");if(r.ok){me=r.user;theme(me.theme)}else{if(!/Сессия/.test(r.error||""))return app.innerHTML=`<div class="card"><h2>Нет соединения</h2><p class="muted">${esc(r.error)}</p></div>`;localStorage.removeItem("tk");token=null}}
  me?shell():authView();
})();
</script>
</body>
</html>
